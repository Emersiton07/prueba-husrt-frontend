<div style="margin-top: 5%; margin-left: 5%; margin-right: 5%; background-color: white;">
</div>

<div class="grid-container">
  <div class="grid-item">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title" style="text-align: center; margin-bottom: 1px;">GESTION DE USUARIOS</h5>
        <div style="text-align: center; margin-bottom: 30px;">
          <i class="bi bi-person-circle" style="font-size: 6rem; color: rgb(0, 0, 0);"></i>
        </div>
        <button type="button" class="btn btn-outline-primary" style="float: left;" >Nuevo
          Usuario</button>
        <button type="button" class="btn btn-outline-success" style="float: right;" >Ver
          Usuarios</button>
      </div>
    </div>
  </div>

  <div class="grid-item">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title" style="text-align: center; margin-bottom: 1px;">GESTION DE EQUIPOS</h5>
        <div style="text-align: center; margin-bottom: 30px;">
          <i class="bi bi-cpu-fill" style="font-size: 6rem; color: rgb(0, 0, 0);"></i>
        </div>
        <button type="button" class="btn btn-outline-primary" style="float: left;" [routerLink]="'/equipos-nuevo'">Nuevo
          Equipo</button>
        <button type="button" class="btn btn-outline-success" style="float: right;" [routerLink]="'/equipos'">Ver
          Equipos</button>
      </div>
    </div>
  </div>

  <div class="grid-item">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title" style="text-align: center; margin-bottom: 1px;">GESTION DE REPORTES</h5>
        <div style="text-align: center; margin-bottom: 30px;">
          <i class="bi bi-file-earmark-text-fill" style="font-size: 6rem; color: rgb(0, 0, 0);"></i>
        </div>
        <button type="button" class="btn btn-outline-success" [routerLink]="'/reportes'">Ver Reportes</button>
      </div>
    </div>
  </div>
